<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing Demo - Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>☁️ Cloud-Deployed Task Manager</h1>
            <p class="subtitle">A Simple Web Application Deployed on Cloud Infrastructure</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingTasks">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>

        <div class="add-task-section">
            <input type="text" id="taskInput" placeholder="Enter a new task..." />
            <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="tasks-container">
            <h2>Your Tasks</h2>
            <ul id="taskList"></ul>
        </div>

        <footer>
            <p>🌐 Deployed on: <strong>Vercel Cloud Platform</strong></p>
            <p>📅 Deployment Date: <span id="deployDate"></span></p>
            <p>🔧 Technologies: HTML, CSS, JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
