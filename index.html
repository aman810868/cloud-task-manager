<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Digital Library | Refined Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cloud Digital Library</h1>
        <p>Dynamic Book Explorer</p>
    </header>

    <main class="container">
        <aside class="sidebar">
            <h3>Genres</h3>
            <ul id="genre-list">
                </ul>
        </aside>

        <section class="content">
            <div id="loading" class="loading-message">
                <p>⚡ Fetching books from the Cloud Library... please wait.</p>
            </div>
            
            <div id="book-grid" class="book-grid" style="display: none;">
                </div>
        </section>
    </main>

    <div id="book-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
