<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Library | Premium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Cloud Digital Library</h1>
            <p>Explore thousands of titles fetched in real-time from the cloud.</p>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for books or authors..." onkeyup="searchBooks()">
            </div>
        </div>
    </header>

    <main class="main-layout">
        <nav class="sidebar">
            <div class="sidebar-header">Genres</div>
            <ul id="genre-list"></ul>
        </nav>

        <section class="content-area">
            <div id="loading" class="loader">
                <div class="spinner"></div>
                <p>Syncing with Cloud Database...</p>
            </div>
            
            <div id="book-grid" class="book-grid"></div>
        </section>
    </main>

    <div id="book-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>f
